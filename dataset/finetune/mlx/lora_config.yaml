model: "mlx-community/Qwen2.5-3B-Instruct-4bit"
train: true
fine_tune_type: lora
optimizer: adamw
data: "dataset/finetune/data"
seed: 0

# Conservative for an 8GB unified-memory Mac -- this run is a cheap local
# sanity-check of the data/pipeline, not the final model (see cloud/ for that).
num_layers: 8
batch_size: 1
grad_accumulation_steps: 4
iters: 500
learning_rate: 1e-5
steps_per_report: 10
steps_per_eval: 200
adapter_path: "dataset/finetune/mlx/adapters"
save_every: 100
max_seq_length: 1536
grad_checkpoint: true

lora_parameters:
  keys: ["self_attn.q_proj", "self_attn.v_proj"]
  rank: 8
  scale: 20.0
  dropout: 0.0
